name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # Il runner non ha i file di sviluppo di PAM né di xkbcommon:
      # servono al link del lock screen e a smithay-client-toolkit.
      run: |
        sudo apt-get update
        sudo apt-get install -y libpam0g-dev libxkbcommon-dev
    - name: Build
      run: cargo build --verbose --locked
    - name: Run tests
      run: cargo test --verbose --locked
