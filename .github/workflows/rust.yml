name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # The runner image lacks the PAM/xkbcommon development files (they
      # link the lock screen to libpam and build smithay-client-toolkit)
      # and the font the layout tests shape against.
      run: |
        sudo apt-get update
        sudo apt-get install -y libpam0g-dev libxkbcommon-dev fonts-dejavu-core
    # Caches the registry and the compiled dependencies between runs: the
    # build only recompiles what changed.
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose --locked
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Run tests
      run: cargo test --verbose --locked
