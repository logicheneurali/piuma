name: Release

# A tag `v<version>` builds the binaries, packages the release tarball with
# its license material and opens a draft GitHub release. Running the
# workflow by hand is a dry run: it builds and uploads the artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # glibc 2.35: the binary runs on Ubuntu 22.04/24.04 and newer, not only
    # on the newest runner image.
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag, Cargo.toml and VERSION must agree: the version cannot
      # drift the way it did between the 0.2.1/0.3.0 release commits.
      - name: Check the version
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "$version" = "$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$version" || {
              echo "tag ${GITHUB_REF_NAME#v} does not match Cargo.toml $version"
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libpam0g-dev libxkbcommon-dev \
            curl ca-certificates git fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -eu
          stage="piuma-$version-linux-x86_64"
          rm -rf "$stage"
          mkdir -p "$stage"
          install -m755 target/release/piuma target/release/piuma-setup "$stage/"
          install -m644 LICENSE THIRD_PARTY_LICENSES.md README.md "$stage/"
          cp -R LICENSES "$stage/"
          tar --owner=0 --group=0 -czf "$stage.tar.gz" -C "$stage" .
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          # The distribution notice must ship with the binaries.
          tar -tzf "$stage.tar.gz" > /tmp/piuma-tar-list
          for entry in piuma piuma-setup LICENSE THIRD_PARTY_LICENSES.md README.md; do
            grep -qx "./$entry" /tmp/piuma-tar-list || {
              echo "release tarball is missing $entry"
              exit 1
            }
          done
          grep -q '^\./LICENSES/' /tmp/piuma-tar-list || {
            echo "release tarball is missing LICENSES/"
            exit 1
          }

      # Source PKGBUILD for the AUR: the tag archive, built with the
      # distribution's toolchain (no prebuilt binary ABI concerns).
      - name: AUR packaging files
        if: github.ref_type == 'tag'
        run: |
          set -eu
          maintainer=$(git log -1 --format='%an <%ae>')
          archive="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum=$(curl -fsSL --retry 3 "$archive" | sha256sum | cut -d' ' -f1)
          mkdir -p aur
          {
            printf '%s\n' "# Maintainer: ${maintainer}"
            printf '%s\n' "pkgname=piuma"
            printf 'pkgver=%s\n' "$version"
            printf '%s\n' "pkgrel=1"
            printf '%s\n' 'pkgdesc="Status bar and setup application for the Hyprland compositor"'
            printf '%s\n' "arch=('x86_64')"
            printf 'url="https://github.com/%s"\n' "$GITHUB_REPOSITORY"
            printf '%s\n' "license=('Apache-2.0')"
            printf '%s\n' "depends=('pam' 'libxkbcommon')"
            printf '%s\n' "makedepends=('cargo' 'pkgconf')"
            printf '%s\n' "optdepends=('hyprland: the supported compositor')"
            printf 'source=("%s")\n' "$archive"
            printf "sha256sums=('%s')\n" "$sum"
            printf '\n%s\n' "build() {"
            printf '\t%s\n' 'cd "$srcdir/piuma-$pkgver"'
            printf '\t%s\n' 'export CARGO_HOME="$srcdir/cargo"'
            printf '\t%s\n' 'cargo build --release --locked'
            printf '%s\n\n' "}"
            printf '%s\n' "package() {"
            printf '\t%s\n' 'cd "$srcdir/piuma-$pkgver"'
            printf '\t%s\n' 'install -Dm755 target/release/piuma "$pkgdir/usr/bin/piuma"'
            printf '\t%s\n' 'install -Dm755 target/release/piuma-setup "$pkgdir/usr/bin/piuma-setup"'
            printf '\t%s\n' 'install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"'
            printf '\t%s\n' 'install -Dm644 THIRD_PARTY_LICENSES.md "$pkgdir/usr/share/licenses/$pkgname/THIRD_PARTY_LICENSES.md"'
            printf '\t%s\n' 'cp -R LICENSES "$pkgdir/usr/share/licenses/$pkgname/LICENSES"'
            printf '%s\n' "}"
          } > aur/PKGBUILD
          printf 'pkgbase = piuma\n' > aur/SRCINFO
          printf '\tpkgdesc = Status bar and setup application for the Hyprland compositor\n' >> aur/SRCINFO
          printf '\tpkgver = %s\n' "$version" >> aur/SRCINFO
          printf '\tpkgrel = 1\n' >> aur/SRCINFO
          printf '\turl = https://github.com/%s\n' "$GITHUB_REPOSITORY" >> aur/SRCINFO
          printf '\tarch = x86_64\n' >> aur/SRCINFO
          printf '\tlicense = Apache-2.0\n' >> aur/SRCINFO
          printf '\tdepends = pam\n' >> aur/SRCINFO
          printf '\tdepends = libxkbcommon\n' >> aur/SRCINFO
          printf '\tmakedepends = cargo\n' >> aur/SRCINFO
          printf '\tmakedepends = pkgconf\n' >> aur/SRCINFO
          printf '\toptdepends = hyprland: the supported compositor\n' >> aur/SRCINFO
          printf '\tsource = %s\n' "$archive" >> aur/SRCINFO
          printf '\tsha256sums = %s\n\n' "$sum" >> aur/SRCINFO
          printf 'pkgname = piuma\n' >> aur/SRCINFO

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: piuma-release
          path: |
            piuma-*.tar.gz
            piuma-*.tar.gz.sha256
      - name: Upload the AUR files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: piuma-aur
          path: aur/

      - name: Create the draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            piuma-*.tar.gz
            piuma-*.tar.gz.sha256
            aur/PKGBUILD
            aur/SRCINFO

  # Pushes the generated PKGBUILD to the AUR. Inert until the three
  # secrets exist (Settings → Secrets): AUR_USERNAME, AUR_EMAIL and
  # AUR_SSH_PRIVATE_KEY, with the key registered on the AUR account and
  # write access to the `piuma` package. Secrets cannot be read from a
  # job-level `if`, so a first step decides whether to publish.
  aur:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the AUR credentials
        id: creds
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ] && [ -n "$AUR_USERNAME" ] && [ -n "$AUR_EMAIL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AUR secrets missing: skipping the AUR publish"
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: piuma-aur
      - name: Name the AUR metadata as the AUR expects it
        if: steps.creds.outputs.ready == 'true'
        run: mv SRCINFO .SRCINFO
      - name: Publish to the AUR
        if: steps.creds.outputs.ready == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: piuma
          pkgbuild: PKGBUILD
          assets: .SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
