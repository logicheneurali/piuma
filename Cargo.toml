[package]
name = "piuma"
version = "0.1.0"
edition = "2021"
description = "Pannello di sistema leggero per Wayland (Hyprland)"
license = "Apache-2.0"

[dependencies]
iced = { version = "0.14", features = ["smol", "advanced", "image", "svg", "canvas"] }
# Operation runner (`iced_runtime::task::widget`): the graph popup
# queries its sensor's on-screen rect through the widget tree.
iced_runtime = "0.14"
iced_exwlshell = { git = "https://github.com/waycrate/exwlshelleventloop.git", branch = "master" }
# Wallpaper palette (`panel.wallpaper_palette`): decode for the
# extraction. Both crates are already in iced's graph (shared, no extra
# weight): `smol` runs the decode off the UI thread.
image = "0.25"
smol = "2"
log = "0.4"
simple_logger = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
# System tray (StatusNotifierItem): async D-Bus client/watcher.
zbus = "5"
# Freedesktop icon-name → file lookup for tray items.
freedesktop-icons = "0.4"
# Text width measurement for pinned sensor values (M5): the same shaper
# iced renders with, already in the tree through iced_graphics.
cosmic-text = "0.15"

[profile.release]
opt-level = "z"
lto = true
strip = true

[[bin]]
name = "piuma-setup"
path = "src/bin/piuma-setup/main.rs"
